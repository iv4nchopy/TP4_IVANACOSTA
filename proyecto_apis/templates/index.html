<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TP4 — Proyecto APIs</title>
<link rel="stylesheet" href="../statics/styles.css">
<style>
body {
    background: url('https://images.pexels.com/photos/110854/pexels-photo-110854.jpeg') no-repeat center center/cover;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
}

/* Cabecera */
h1 {
    text-align: center;
    margin-top: 40px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
}

/* Contenedor de botones */
.botonera {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 30px;
}

/* Botones principales */
.botonera a {
    text-decoration: none;
}

.botonera button {
    width: 200px;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background-color: rgba(0,0,0,0.6);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.botonera button:hover {
    background-color: rgba(43,61,143,0.8);
}

/* Bienvenida */
#mensajeBienvenida {
    text-align: center;
    font-size: 1.2rem;
    margin-top: 15px;
    margin-bottom: 10px;
}

#btnIngresarNombre, #btnBorrarNombre {
    margin: 5px;
    padding: 8px 15px;
    border: none;
    border-radius: 8px;
    background-color: rgba(0,0,0,0.6);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

#btnIngresarNombre:hover, #btnBorrarNombre:hover {
    background-color: rgba(43,61,143,0.8);
}
</style>
</head>
<body>

<h1>TP4 — Proyecto APIs</h1>

<div id="mensajeBienvenida">¡Bienvenido! Presiona "Ingresar nombre y apellido" para personalizar.</div>
<div style="text-align:center;">
    <button id="btnIngresarNombre">Ingresar nombre y apellido</button>
    <button id="btnBorrarNombre">Borrar nombre</button>
</div>

<div class="botonera">
    <a href="clima.html"><button>API Clima</button></a>
    <a href="cripto.html"><button>API Criptomonedas</button></a>
    <a href="paises.html"><button>API Países</button></a>
    <a href="pokemon.html"><button>API Pokémon</button></a>
    <a href="rick.html"><button>API Rick & Morty</button></a>
</div>

<script src="../js/script_bienvenida.js"></script>
</body>
</html>
